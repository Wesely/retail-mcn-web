<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>銷售 MCN</title>
  <style>
    :root { color-scheme: light dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0f172a;
      color: #e2e8f0;
      line-height: 1.6;
    }
    main {
      text-align: center;
      padding: 2rem;
    }
    h1 {
      font-size: clamp(2rem, 6vw, 3.5rem);
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    p {
      margin-top: 1rem;
      color: #94a3b8;
      font-size: clamp(1rem, 2.5vw, 1.25rem);
    }
  </style>
</head>
<body>
  <main>
    <h1>Hello</h1>
    <p>銷售 MCN — 網站建置中</p>
  </main>
</body>
</html>
